services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/minishop
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-any-shared-deployment}
      CORS_ORIGINS: http://localhost:3000
      PORT: 4000
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-customer-demo-123}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-demo-123}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:4000
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  mongo_data:
